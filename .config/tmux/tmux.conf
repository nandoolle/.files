set -g default-terminal "tmux-256color"
# Terminal.app has no true color; only advertise RGB for terminals that do
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-kitty:RGB,alacritty:RGB,wezterm:RGB"

set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g default-command "${SHELL}"

# 5: prefix C-Space (C-b kept as secondary so old habit still works)
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix
bind C-b send-prefix -2

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

set -g display-time 2000
# vitals takes ~1.7s per tick (iostat sampling); 1s made runs overlap
set -g status-interval 5
# Ghostty's titlebar is hidden, so the bar takes the top edge of the window
set -g status-position top

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Shift+arrows: Alt+arrows collide with zsh word navigation (Option as Meta)
bind -n S-Left  select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up    select-pane -U
bind -n S-Down  select-pane -D

# Dim plain text in inactive panes (fg only: an explicit bg goes opaque in Ghostty)
set -g window-style 'fg=#565f89'
set -g window-active-style 'fg=#c0caf5'

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r Tab last-window
bind Space next-layout
bind z resize-pane -Z
bind ! break-pane
bind @ join-pane -t !

# prefix+N past the last window lands on the last window instead of erroring
bind 1 if -F "#{>=:#{session_windows},1}" "select-window -t :=1" "select-window -t ':{end}'"
bind 2 if -F "#{>=:#{session_windows},2}" "select-window -t :=2" "select-window -t ':{end}'"
bind 3 if -F "#{>=:#{session_windows},3}" "select-window -t :=3" "select-window -t ':{end}'"
bind 4 if -F "#{>=:#{session_windows},4}" "select-window -t :=4" "select-window -t ':{end}'"
bind 5 if -F "#{>=:#{session_windows},5}" "select-window -t :=5" "select-window -t ':{end}'"
bind 6 if -F "#{>=:#{session_windows},6}" "select-window -t :=6" "select-window -t ':{end}'"
bind 7 if -F "#{>=:#{session_windows},7}" "select-window -t :=7" "select-window -t ':{end}'"
bind 8 if -F "#{>=:#{session_windows},8}" "select-window -t :=8" "select-window -t ':{end}'"
bind 9 if -F "#{>=:#{session_windows},9}" "select-window -t :=9" "select-window -t ':{end}'"

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

bind S command-prompt -p "new session:" "new-session -s '%%'"
bind R command-prompt -I "#S" -p "rename session:" "rename-session '%%'"
# Kill prompts: Enter, y/Y or Space confirm; any other key cancels
#
# confirm-before only accepts a single confirm key, so a shared key
# table runs the command stored in @kill_cmd instead.
bind & set -g @kill_cmd kill-window  \; display "kill window #W? [Y/n]"  \; switch-client -T kill
bind x set -g @kill_cmd kill-pane    \; display "kill pane #P? [Y/n]"    \; switch-client -T kill
bind X set -g @kill_cmd kill-session \; display "kill session #S? [Y/n]" \; switch-client -T kill
bind -T kill Enter run-shell "tmux #{@kill_cmd}"
bind -T kill y     run-shell "tmux #{@kill_cmd}"
bind -T kill Y     run-shell "tmux #{@kill_cmd}"
bind -T kill Space run-shell "tmux #{@kill_cmd}"

source-file ~/.config/tmux/move-mode.tmux
source-file ~/.config/tmux/ai-mode.tmux

# Tabs stretch to fill the bar. tmux cannot compute a padding width at render
# time, so this recomputes it on geometry changes only -- never per tick.
set-hook -g window-linked   "run-shell -b ~/.config/tmux/tools/fit-tabs.sh"
set-hook -g window-unlinked "run-shell -b ~/.config/tmux/tools/fit-tabs.sh"
set-hook -g client-resized  "run-shell -b ~/.config/tmux/tools/fit-tabs.sh"
bind s choose-tree -Zs
# Notes: floating nvim in its own "notes" session, toggled by prefix+n or the status-bar icon.
#
# The session keeps nvim alive between openings; detaching the popup client closes it.
notes_dir="$HOME/.menunotes.tmux/notes"
notes_open="tmux new-session -d -s notes -c $notes_dir nvim notes.md 2>/dev/null; tmux set -t notes status off; tmux attach -t notes"
notes_toggle="if tmux list-clients -t notes 2>/dev/null | grep -q .; then tmux detach-client -s notes; else tmux display-popup -E -w 70% -h 75% -T ' notes ' \"$notes_open\"; fi"
set -g @notes_toggle "$notes_toggle"
bind n run-shell -b "#{@notes_toggle}"
# Status bar clicks: the notes icon, a tab's X, or the tab itself.
# The X carries its window number in the range name (close-N).
# Left click selects the tab, middle click closes it. Both rely on tmux's own
# range=window, which already points the command at the clicked window via -t =.
bind -T root MouseDown1Status if -F "#{==:#{mouse_status_range},notes}" \
  "run-shell -b '#{@notes_toggle}'" \
  "select-window -t ="
bind -T root MouseDown2Status kill-window -t =
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

set -g @plugin 'tmux-plugins/tpm'

source-file ~/.config/tmux/tokyo-night.conf

run '~/.config/tmux/plugins/tpm/tpm'

# first fit, after the theme has defined the formats
run-shell -b ~/.config/tmux/tools/fit-tabs.sh
