set -g default-terminal "tmux-256color"
# Terminal.app has no true color; only advertise RGB for terminals that do
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-kitty:RGB,alacritty:RGB,wezterm:RGB"

set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g default-command "${SHELL}"

# 5: prefix C-Space (C-b kept as secondary so old habit still works)
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix
bind C-b send-prefix -2

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Sessions start at 1 too (see scripts/session-index.sh)
set-hook -g session-created "run-shell '~/.config/tmux/scripts/session-index.sh #{hook_session_name}'"
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

set -g display-time 2000
# vitals takes ~1.7s per tick (iostat sampling); 1s made runs overlap
set -g status-interval 5
# Ghostty's titlebar is hidden, so the bar takes the top edge of the window
set -g status-position top

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Shift+arrows: Alt+arrows collide with zsh word navigation (Option as Meta)
bind -n S-Left  select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up    select-pane -U
bind -n S-Down  select-pane -D

# Dim plain text in inactive panes (fg only: an explicit bg goes opaque in Ghostty)
set -g window-style 'fg=#565f89'
set -g window-active-style 'fg=#c0caf5'

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r Tab last-window
bind Space next-layout
bind z resize-pane -Z
bind ! break-pane
bind @ join-pane -t !

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "pbcopy"

bind S command-prompt -p "new session:" "new-session -s '%%'"
bind R command-prompt -I "#S" -p "rename session:" "rename-session '%%'"
# -y: Enter alone confirms, like [Y/n]
bind & confirm-before -y -p "kill window #W? [Y/n]" kill-window
bind x confirm-before -y -p "kill pane #P? [Y/n]" kill-pane
bind X confirm-before -y -p "kill session #S? [Y/n]" kill-session
bind s choose-tree -Zs
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'k8adev/tmux-vitals'
set -g @plugin 'janoamaral/tokyo-night-tmux'   # theme: status bar, windows, pane borders

set -g @tokyo-night-tmux_theme night          # night | storm | moon | day
set -g @tokyo-night-tmux_transparent 1        # inherit the terminal background
# "digital" needs Unicode 13 legacy-computing digits (U+1FBF0), missing in most fonts
set -g @tokyo-night-tmux_window_id_style fsquare
set -g @tokyo-night-tmux_show_datetime 1
set -g @tokyo-night-tmux_date_format DMY
set -g @tokyo-night-tmux_time_format 24H
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_path_format relative
# system stats (cpu/mem/net/battery) come from tmux-vitals, so the theme's own widgets stay off

set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh vim nvim btop "~claude" "~op run"'

run '~/.tmux/plugins/tpm/tpm'

# Status bar layout (spacer line, theme bar, vitals line). Must run AFTER tpm.
run-shell ~/.config/tmux/scripts/statusbar.sh
