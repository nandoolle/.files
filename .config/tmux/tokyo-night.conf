# Tokyo Night (night) status bar in pure tmux formats: no shell scripts, no polling.
#
# Replaces janoamaral/tokyo-night-tmux, whose widgets fork ~7 processes per tick.

# --- palette ---
tn_bar_top="#1f2335"
tn_bar_bottom="#24283b"
tn_tab="#2c314a"
tn_tab_active="#3b4261"
tn_black="#2A2F41"
tn_bblack="#414868"
tn_fg="#a9b1d6"
tn_blue="#7aa2f7"
tn_green="#73daca"
tn_cyan="#41a6b5"
tn_yellow="#e0af68"
tn_red="#f7768e"
tn_magenta="#bb9af7"
tn_blue_dark="#3d59a1"

# --- chrome ---
set -g status-position top
set -g status-justify left
set -g status-style "bg=$tn_bar_top"
set -g message-style "bg=$tn_blue,fg=$tn_black"
set -g message-command-style "fg=$tn_blue,bg=$tn_black"
set -g mode-style "fg=$tn_cyan,bg=$tn_black"
set -g pane-border-style "fg=$tn_black"
set -g pane-active-border-style "fg=$tn_blue"
set -g pane-border-lines single

# --- app icon, shared by the tabs and the second line ---
#
# Claude's process name is its version number, hence the digit match.
tn_cmd="#{pane_current_command}"
tn_is_claude="#{m:[0-9]*.[0-9]*.[0-9]*,$tn_cmd}"
tn_app="#{?$tn_is_claude,claude,$tn_cmd}"
source-file ~/.config/tmux/icons.conf

# --- window index in Nerd Font squares (filled / hollow / double) ---
tn_fsq="s/0/󰎡/;s/1/󰎤/;s/2/󰎧/;s/3/󰎪/;s/4/󰎭/;s/5/󰎱/;s/6/󰎳/;s/7/󰎶/;s/8/󰎹/;s/9/󰎼/"
tn_hsq="s/0/󰎣/;s/1/󰎦/;s/2/󰎩/;s/3/󰎬/;s/4/󰎮/;s/5/󰎰/;s/6/󰎵/;s/7/󰎸/;s/8/󰎻/;s/9/󰎾/"
tn_dsq="s/0/󰎢/;s/1/󰎥/;s/2/󰎨/;s/3/󰎫/;s/4/󰎲/;s/5/󰎯/;s/6/󰎴/;s/7/󰎷/;s/8/󰎺/;s/9/󰎽/"
tn_win_id="#{$tn_fsq:window_index} "
tn_pane_id="#{?window_zoomed_flag,#{$tn_dsq:pane_index},#{$tn_hsq:pane_index}}"
tn_ssh="#{?#{==:#{pane_current_command},ssh},󰣀 , }"

# --- left: prefix indicator + session ---
set -g status-left-length 80
set -g status-left "#[fg=$tn_black,bg=$tn_blue_dark,bold] #[fg=#ffffff]λ #[fg=#15161e]#[bold,nodim]#S #[fg=$tn_blue_dark,bg=$tn_bar_top] #[fg=$tn_bblack]│"

# --- windows ---
# Outer ends are angled; between tabs the plain bar stays, since a separator
# cannot know the neighbour's background and would mis-join beside the active tab.
tn_tab_close="#[fg=#15161e]  "
tn_tab_end="#{?loop_last_flag,#[fg=$tn_bblack#,bg=$tn_bar_top]│,}"
set -g window-status-separator "#[fg=$tn_bblack,bg=$tn_bar_top]│"
set -g window-status-style default
set -g window-status-current-style default
# @tab_name_width is filled in by tools/fit-tabs.sh, which replaces the
# #{p@W:} placeholder with a literal number. tmux padding takes no expression.
set -g window-status-format "#[fg=$tn_fg,bg=$tn_tab,nobold,noitalics,nounderscore,nodim]$tn_tab_close#[fg=$tn_icon_fg]$tn_icon #[fg=$tn_fg]#{p@W:window_name} #[dim,fg=#{?window_last_flag,$tn_fg,$tn_tab}]󰁯#[nodim]  #[fg=$tn_fg]$tn_win_id#[dim]$tn_pane_id#[nodim] $tn_tab_end"
set -g window-status-current-format "#[fg=#ffffff,bg=$tn_tab_active,bold,noitalics,nounderscore,nodim]$tn_tab_close#[fg=$tn_icon_fg]$tn_icon #[fg=#ffffff]#{p@W:window_name} #[nobold,dim,fg=#{?window_last_flag,$tn_fg,$tn_tab_active}]󰁯#[nodim]  #[fg=#ffffff,bold]$tn_win_id#[nobold]$tn_pane_id#[bold] $tn_tab_end"

# --- second line: <icon> <app> <title, or cwd when the app sets none>; date/time on the right ---
#
# pane_title is pushed by the app (Neovim: "file:line", Claude: session name), so nothing polls.
tn_has_title="#{&&:#{!=:#{pane_title},},#{!=:#{pane_title},#{host}}}"
tn_body="#{?$tn_has_title,#{s|^✳ ||:pane_title},#{s|^$HOME|~|:pane_current_path}}"
set -g status 2
# --- right of the tabs: mode indicator (like nvim's) + notes icon (click target, see tmux.conf) ---
#
# Precedence: prefix > pane mode (copy/view/tree) > custom key table (kill) > normal.
tn_mode_prefix="#[fg=$tn_yellow#,bg=$tn_bar_top]#[fg=$tn_black#,bg=$tn_yellow#,bold] PREFIX "
# pane_mode names are lowercase; tmux has no case modifier, so map the known
# set explicitly. The outer s/-mode// is the fallback for anything unmapped.
tn_pane_named="#{s/copy-mode/COPY/:#{s/tree-mode/TREE/:#{s/buffer-mode/BUFFER/:#{s/client-mode/CLIENT/:#{s/options-mode/OPTIONS/:pane_mode}}}}}"
tn_pane_label="#{s/-mode//:$tn_pane_named}"
tn_mode_pane="#[fg=$tn_green#,bg=$tn_bar_top]#[fg=$tn_black#,bg=$tn_green#,bold] $tn_pane_label "
tn_mode_kill="#[fg=$tn_red#,bg=$tn_bar_top]#[fg=$tn_black#,bg=$tn_red#,bold] KILL "
tn_mode_table="#[fg=$tn_magenta#,bg=$tn_bar_top]#[fg=$tn_black#,bg=$tn_magenta#,bold] #{s/move/MOVE/:#{s/move-pane/MOVE-PANE/:#{s/move-window/MOVE-WINDOW/:#{s/move-resize/RESIZE/:client_key_table}}}} "
tn_mode_normal="#[fg=$tn_blue#,bg=$tn_bar_top]#[fg=$tn_black#,bg=$tn_blue#,bold] NORMAL "
tn_mode="#{?client_prefix,$tn_mode_prefix,#{?pane_in_mode,$tn_mode_pane,#{?#{==:#{client_key_table},kill},$tn_mode_kill,#{?#{!=:#{client_key_table},root},$tn_mode_table,$tn_mode_normal}}}}"
set -g status-right "$tn_mode#[range=user|notes]#[fg=$tn_fg,bg=$tn_tab] 󰭋 #[norange]"
set -g 'status-format[1]' "#[fill=$tn_bar_bottom,bg=$tn_bar_bottom]#[align=left] #[fg=$tn_icon_fg]$tn_icon #[fg=brightwhite,nobold,noitalics,nounderscore,nodim]$tn_app #[fg=$tn_fg]$tn_body#[align=right]#[fg=$tn_bblack,bg=$tn_bar_bottom]#[fg=$tn_fg,bg=$tn_bblack] %d-%m-%Y ❬ %H:%M "
